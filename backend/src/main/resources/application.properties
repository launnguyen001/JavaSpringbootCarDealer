spring.application.name=lab5

# ===================== SQL (MySQL/MariaDB qua DDEV) =====================
# DDEV: `ddev start` trong thư mục gốc dự án -> MariaDB 10.11 trên 127.0.0.1:3306
# (host_db_port: "3306" trong .ddev/config.yaml). User root/root của DDEV.
spring.datasource.url=jdbc:mysql://localhost:3306/ngoclaudb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================== NoSQL (MongoDB qua DDEV) =====================
# DDEV add-on ddev/ddev-mongo: MongoDB 9 trên 127.0.0.1:27017, user root db/db nằm ở DB admin.
# Spring Boot 4: thông số kết nối dùng prefix 'spring.mongodb' (không còn 'spring.data.mongodb').
spring.mongodb.uri=mongodb://db:db@localhost:27017/cardealer?authSource=admin
# 'auto-index-creation' vẫn thuộc namespace spring.data.mongodb (DataMongoProperties).
# true vì đã có MongoDB thật (tự tạo index unique/text cho các @Indexed).
spring.data.mongodb.auto-index-creation=true

# ===================== Cache (Redis qua DDEV) =====================
# Đã có Redis thật (add-on ddev/ddev-redis, Redis 8 trên 127.0.0.1:6379, không pass)
# nên dùng 'redis' -> CacheConfig sẽ tạo RedisCacheManager.
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.redis.time-to-live=600000

# ===================== OpenAPI / Swagger UI =====================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ===================== JWT Authentication =====================
app.jwt.secret=CarDealerSecretKey2026!@#CarDealerSecretKey2026!@#
app.jwt.expiration-ms=86400000

# ===================== CORS =====================
# Origin của frontend Next.js (dev). Frontend bình thường gọi qua rewrite '/api' (same-origin),
# danh sách này là lưới an toàn khi gọi trực tiếp http://localhost:8080 từ trình duyệt.
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001

# ===================== Seed dữ liệu mẫu =====================
app.seed.enabled=true

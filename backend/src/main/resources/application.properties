spring.application.name=lab5

# ===================== SQL (MySQL) =====================
spring.datasource.url=jdbc:mysql://localhost:3306/ngoclaudb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================== NoSQL (MongoDB) =====================
spring.data.mongodb.uri=mongodb://localhost:27017/cardealer
# false để app vẫn khởi động được khi MongoDB chưa cài.
# Đặt lại thành 'true' sau khi đã cài MongoDB (tự tạo index unique/text).
spring.data.mongodb.auto-index-creation=false

# ===================== Cache (Redis) =====================
# 'simple' (in-memory) để chạy được khi Redis chưa cài.
# Khi đã cài Redis, đổi thành 'redis' (lúc đó CacheConfig sẽ tạo RedisCacheManager).
spring.cache.type=simple
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.redis.time-to-live=600000

# ===================== OpenAPI / Swagger UI =====================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ===================== JWT Authentication =====================
app.jwt.secret=CarDealerSecretKey2026!@#CarDealerSecretKey2026!@#
app.jwt.expiration-ms=86400000

# ===================== CORS =====================
# Origin của frontend Next.js (dev). Frontend bình thường gọi qua rewrite '/api' (same-origin),
# danh sách này là lưới an toàn khi gọi trực tiếp http://localhost:8080 từ trình duyệt.
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001

# ===================== Seed dữ liệu mẫu =====================
app.seed.enabled=true

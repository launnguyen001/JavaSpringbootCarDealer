spring.application.name=lab5

# ===================== SQL (MySQL) =====================
spring.datasource.url=jdbc:mysql://localhost:3306/lauth43?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================== NoSQL (MongoDB) =====================
spring.data.mongodb.uri=mongodb://localhost:27017/cardealer
spring.data.mongodb.auto-index-creation=true

# ===================== Cache (Redis) =====================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=600000

# ===================== OpenAPI / Swagger UI =====================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ===================== Seed dữ liệu mẫu =====================
app.seed.enabled=true

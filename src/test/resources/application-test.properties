# ===================== Test profile =====================
# SQL: H2 in-memory (thay cho MySQL khi chạy test)
spring.datasource.url=jdbc:h2:mem:cardealer;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# NoSQL: MongoDB (không có server trong môi trường test -> chỉ tạo bean, không kết nối)
spring.data.mongodb.uri=mongodb://localhost:27017/cardealer-test
# Không tạo index lúc khởi động (tránh kết nối Mongo khi test)
spring.data.mongodb.auto-index-creation=false

# Cache: dùng cache đơn giản trong bộ nhớ cho test
spring.cache.type=simple
